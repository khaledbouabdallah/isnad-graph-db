services:
  neo4j:
    image: neo4j:5.15
    container_name: isnad-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-password123}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
    networks:
      - isnad-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isnad-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      - CORS_ORIGINS=http://localhost:3000,https://${DOMAIN:-localhost}
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - isnad-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isnad-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
    depends_on:
      - backend
    networks:
      - isnad-network

  # Caddy for reverse proxy + automatic HTTPS (production)
  caddy:
    image: caddy:2-alpine
    container_name: isnad-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - isnad-network
    profiles:
      - production

volumes:
  neo4j_data:
  caddy_data:
  caddy_config:

networks:
  isnad-network:
    driver: bridge